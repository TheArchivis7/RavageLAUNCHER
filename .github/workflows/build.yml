name: Build Ravage Launcher

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "app.manifest"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Windows executable
        run: dotnet publish RavageLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavageLauncher-win-x64
          path: publish/RavageLauncher.exe
